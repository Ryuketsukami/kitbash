apiVersion: 1

datasources:
  - name: Pulse Postgres
    uid: pulse-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: pulse
    jsonData:
      database: pulse
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: pulse-dev-password
